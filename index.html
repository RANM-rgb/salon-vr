<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salon VR Shinecon iPhone</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        background:#000;
        font-family:Arial, Helvetica, sans-serif;
    }

    #viewer{
        width:100vw;
        height:100vh;
    }

    .hud{
        position:fixed;
        top:20px;
        left:50%;
        transform:translateX(-50%);
        z-index:100;
        display:flex;
        gap:10px;
    }

    button{
        padding:12px 20px;
        border:none;
        border-radius:12px;
        background:#2563eb;
        color:white;
        font-weight:bold;
        cursor:pointer;
        font-size:16px;
    }

    .controls{
        position:fixed;
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        z-index:100;
        display:flex;
        gap:10px;
    }
</style>
</head>

<body>

<div class="hud">
    <button id="vrButton">Activar VR Shinecon</button>
    <button id="recenter">Recentrar</button>
</div>

<div class="controls">
    <button id="forward">↑</button>
    <button id="backward">↓</button>
    <button id="left">←</button>
    <button id="right">→</button>
</div>

<div id="viewer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';

const container = document.getElementById('viewer');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    2000
);

camera.position.set(0,2,8);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);

controls.enableDamping = true;
controls.enablePan = false;

const hemiLight = new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2
);

scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff,2);

dirLight.position.set(10,20,10);

scene.add(dirLight);

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    new THREE.MeshStandardMaterial({
        color:0x999999
    })
);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

const loader = new ColladaLoader();

loader.load(
    './salony8.dae',
    (collada)=>{

        const model = collada.scene;

        model.scale.set(1,1,1);

        model.position.set(0,0,0);

        scene.add(model);

    }
);

const keys = {
    forward:false,
    backward:false,
    left:false,
    right:false
};

document.getElementById('forward').ontouchstart = ()=>{
    keys.forward = true;
};

document.getElementById('forward').ontouchend = ()=>{
    keys.forward = false;
};

document.getElementById('backward').ontouchstart = ()=>{
    keys.backward = true;
};

document.getElementById('backward').ontouchend = ()=>{
    keys.backward = false;
};

document.getElementById('left').ontouchstart = ()=>{
    keys.left = true;
};

document.getElementById('left').ontouchend = ()=>{
    keys.left = false;
};

document.getElementById('right').ontouchstart = ()=>{
    keys.right = true;
};

document.getElementById('right').ontouchend = ()=>{
    keys.right = false;
};

window.addEventListener('keydown',(e)=>{

    if(e.code==='KeyW') keys.forward = true;
    if(e.code==='KeyS') keys.backward = true;
    if(e.code==='KeyA') keys.left = true;
    if(e.code==='KeyD') keys.right = true;

});

window.addEventListener('keyup',(e)=>{

    if(e.code==='KeyW') keys.forward = false;
    if(e.code==='KeyS') keys.backward = false;
    if(e.code==='KeyA') keys.left = false;
    if(e.code==='KeyD') keys.right = false;

});

document.getElementById('recenter').onclick = ()=>{

    camera.position.set(0,2,8);

};

document.getElementById('vrButton').onclick = async ()=>{

    if(
        typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function'
    ){

        try{

            const permission = await DeviceMotionEvent.requestPermission();

            if(permission === 'granted'){

                alert('VR activado');

            }

        }catch(err){

            console.log(err);

        }

    }

};

function updateGamepad(){

    const gamepads = navigator.getGamepads();

    if(!gamepads) return;

    const gp = gamepads[0];

    if(!gp) return;

    const lx = gp.axes[0];
    const ly = gp.axes[1];

    const rx = gp.axes[2];
    const ry = gp.axes[3];

    const speed = 0.15;

    if(Math.abs(ly)>0.1){

        camera.position.z += ly * speed;

    }

    if(Math.abs(lx)>0.1){

        camera.position.x += lx * speed;

    }

    if(Math.abs(rx)>0.1){

        camera.rotation.y -= rx * 0.03;

    }

    if(Math.abs(ry)>0.1){

        camera.rotation.x -= ry * 0.03;

    }

}

function moveKeyboard(){

    const speed = 0.15;

    if(keys.forward){

        camera.position.z -= speed;

    }

    if(keys.backward){

        camera.position.z += speed;

    }

    if(keys.left){

        camera.position.x -= speed;

    }

    if(keys.right){

        camera.position.x += speed;

    }

}

function animate(){

    requestAnimationFrame(animate);

    moveKeyboard();

    updateGamepad();

    controls.update();

    renderer.render(scene,camera);

}

animate();

window.addEventListener('resize',()=>{

    camera.aspect = window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
